<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZI Portfolio</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#0f172a;
            color:white;
        }

        nav{
            background:#020617;
            padding:15px 30px;
            display:flex;
            justify-content:center;
            gap:30px;
            position:sticky;
            top:0;
        }

        nav a{
            color:white;
            text-decoration:none;
            font-weight:bold;
            transition:.3s;
        }

        nav a:hover{
            color:#38bdf8;
        }

        header{
            background:#1e293b;
            text-align:center;
            padding:50px 20px;
        }

        header h1{
            color:#38bdf8;
            font-size:42px;
            margin-bottom:10px;
        }

        header p{
            color:#cbd5e1;
            font-size:18px;
        }

        .container{
            padding:50px 20px;
        }

        .card{
            max-width:700px;
            margin:auto;
            background:#1e293b;
            padding:30px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 0 15px rgba(0,0,0,.3);
        }

        .card h2{
            color:#38bdf8;
            margin-bottom:20px;
        }

        .card p{
            line-height:1.8;
        }

        .btn{
            display:inline-block;
            margin-top:25px;
            background:#38bdf8;
            color:white;
            text-decoration:none;
            padding:12px 25px;
            border-radius:8px;
        }

        .btn:hover{
            background:#0ea5e9;
        }

        footer{
            margin-top:50px;
            background:#020617;
            text-align:center;
            padding:20px;
            color:#94a3b8;
        }
    </style>
</head>

<body>

<nav>
    <a href="#">الرئيسية</a>
    <a href="#">من أنا</a>
    <a href="#">مشاريعي</a>
    <a href="#">تواصل معي</a>
</nav>

<header>
    <h1>🌐 AZI Portfolio</h1>
    <p>مطور مواقع وتطبيقات | صانع محتوى رقمي | مهتم بالذكاء الاصطناعي</p>
</header>

<div class="container">
    <div class="card">
        <h2>مرحبًا بك</h2>

        <p>
            أهلاً بك في موقعي الشخصي.
            هنا أشارك مشاريعي وأعمالي في تطوير المواقع والتطبيقات،
            والذكاء الاصطناعي، والتسويق الرقمي.
        </p>

        <a href="#" class="btn">تواصل معي</a>
    </div>
</div>

<footer>
    © 2026 AZI Portfolio - جميع الحقوق محفوظة
</footer>

</body>
</html>
